<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Ice Prospector — 3D Terrain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #000; color: #e8eaf0; }

        #canvas3d { width: 100%; height: 100%; display: block; }

        /* ── HUD Overlay ── */
        .hud { position: fixed; z-index: 10; pointer-events: none; }
        .hud > * { pointer-events: auto; }

        /* Top-left: title */
        .hud-title {
            position: fixed; top: 20px; left: 24px;
            z-index: 10;
        }
        .hud-title h1 {
            font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e8eaf0, #00d4ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hud-title .sub { font-size: 11px; color: #555875; margin-top: 2px; }

        /* Top-right: controls */
        .hud-controls {
            position: fixed; top: 20px; right: 24px;
            display: flex; flex-direction: column; gap: 6px;
            z-index: 10;
        }
        .ctrl-btn {
            padding: 8px 16px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(10, 10, 30, 0.85);
            color: #8b8fa8; font-size: 12px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
            font-family: inherit; backdrop-filter: blur(12px);
            text-align: left;
        }
        .ctrl-btn:hover { border-color: rgba(0,212,255,0.3); color: #e8eaf0; }
        .ctrl-btn.active { border-color: rgba(0,212,255,0.4); color: #00d4ff; background: rgba(0,212,255,0.08); }

        /* Bottom-left: info panel */
        .hud-info {
            position: fixed; bottom: 20px; left: 24px;
            padding: 14px 18px; border-radius: 10px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            z-index: 10; min-width: 220px;
        }
        .hud-info .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 3px 0; font-size: 12px;
        }
        .info-row .label { color: #555875; }
        .info-row .value { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 12px; }

        /* Bottom-center: exaggeration slider */
        .hud-slider {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 12px;
            padding: 10px 18px; border-radius: 10px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            z-index: 10;
        }
        .hud-slider label { font-size: 11px; color: #8b8fa8; white-space: nowrap; }
        .hud-slider input[type=range] {
            width: 140px; height: 3px; appearance: none;
            background: rgba(255,255,255,0.1); border-radius: 2px; outline: none;
        }
        .hud-slider input[type=range]::-webkit-slider-thumb {
            appearance: none; width: 14px; height: 14px; border-radius: 50%;
            background: #00d4ff; cursor: pointer;
            box-shadow: 0 0 10px rgba(0,212,255,0.5);
        }
        .hud-slider .slider-val {
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            color: #00d4ff; min-width: 28px; text-align: right;
        }

        /* Bottom-right: back button */
        .hud-back {
            position: fixed; bottom: 20px; right: 24px; z-index: 10;
        }
        .hud-back a {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            color: #8b8fa8; text-decoration: none;
            font-size: 12px; font-weight: 500;
            backdrop-filter: blur(12px); transition: all 0.2s;
        }
        .hud-back a:hover { border-color: rgba(0,212,255,0.3); color: #00d4ff; }

        /* Loading overlay */
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #06060f; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.8s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 50px; height: 50px; border: 3px solid rgba(0,212,255,0.1);
            border-top-color: #00d4ff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text { margin-top: 16px; font-size: 13px; color: #555875; }
        .loading-pct { font-family: 'JetBrains Mono', monospace; color: #00d4ff; font-size: 18px; margin-top: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Crater labels */
        .crater-label {
            position: absolute; pointer-events: none;
            font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.7);
            text-shadow: 0 0 8px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
            white-space: nowrap; transform: translate(-50%, -50%);
            letter-spacing: 0.05em; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading terrain data...</div>
        <div class="loading-pct" id="loadPct">0%</div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="canvas3d"></canvas>

    <!-- Crater labels container -->
    <div id="craterLabels"></div>

    <!-- HUD: Title -->
    <div class="hud-title">
        <h1>🌑 Lunar South Pole — 3D Terrain</h1>
        <div class="sub">Chandrayaan-2 DFSAR + NASA LOLA DEM • Drag to orbit, scroll to zoom</div>
    </div>

    <!-- HUD: Texture controls -->
    <div class="hud-controls">
        <button class="ctrl-btn active" data-texture="combined" id="texCombined">🌑 Terrain + Ice</button>
        <button class="ctrl-btn" data-texture="cpr" id="texCPR">📡 CPR Radar</button>
        <button class="ctrl-btn" data-texture="ice" id="texIce">🧊 Ice Probability</button>
        <button class="ctrl-btn" data-texture="slope" id="texSlope">⛰️ Slope Safety</button>
        <button class="ctrl-btn" id="toggleWireframe">◻ Wireframe</button>
        <button class="ctrl-btn" id="toggleBloom">✦ Glow: ON</button>
        <button class="ctrl-btn" id="autoRotate">↻ Auto-Rotate</button>
    </div>

    <!-- HUD: Vertical exaggeration -->
    <div class="hud-slider">
        <label>Vertical Scale</label>
        <input type="range" id="exagSlider" min="1" max="20" value="5" step="0.5">
        <span class="slider-val" id="exagVal">5×</span>
    </div>

    <!-- HUD: Info -->
    <div class="hud-info" id="hudInfo">
        <div class="info-row"><span class="label">Elevation Range</span><span class="value" id="infoElev">—</span></div>
        <div class="info-row"><span class="label">Coverage</span><span class="value" id="infoCov">—</span></div>
        <div class="info-row"><span class="label">Camera Alt</span><span class="value" id="infoCam">—</span></div>
        <div class="info-row"><span class="label">Vertices</span><span class="value" id="infoVerts">—</span></div>
    </div>

    <!-- HUD: Back link -->
    <div class="hud-back">
        <a href="index.html">← Back to 2D Dashboard</a>
    </div>

    <!-- Three.js + OrbitControls from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

    // ── Config ──
    const ASSETS = 'assets/3d/';
    const TEXTURE_FILES = {
        combined: 'texture_combined.png',
        cpr: 'texture_cpr.png',
        ice: 'texture_ice.png',
        slope: 'texture_slope.png'
    };

    let scene, camera, renderer, controls, composer, bloomPass;
    let terrain, terrainGeo;
    let textures = {};
    let meta = {};
    let verticalExag = 5;
    let heightData = null;
    let wireframeOn = false;
    let bloomOn = true;
    let craterLabels = [];
    let loaded = 0;
    const totalAssets = 6; // heightmap + 4 textures + meta

    // ── Init Three.js ──
    function init() {
        const canvas = document.getElementById('canvas3d');

        // Renderer
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);
        scene.fog = new THREE.FogExp2(0x020208, 0.00015);

        // Camera
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 400, 500);

        // Controls
        controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 50;
        controls.maxDistance = 2000;
        controls.maxPolarAngle = Math.PI * 0.48;
        controls.target.set(0, 0, 0);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x334466, 0.4);
        scene.add(ambientLight);

        // Low-angle directional (like sun at horizon — dramatic crater shadows)
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(300, 80, -200);
        scene.add(sunLight);

        // Fill light from opposite side
        const fillLight = new THREE.DirectionalLight(0x4488cc, 0.3);
        fillLight.position.set(-200, 100, 300);
        scene.add(fillLight);

        // Subtle rim light from below
        const rimLight = new THREE.DirectionalLight(0x0044ff, 0.15);
        rimLight.position.set(0, -100, 0);
        scene.add(rimLight);

        // Stars
        createStars();

        // Post-processing (bloom for ice glow)
        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.6, 0.4, 0.85
        );
        composer.addPass(bloomPass);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Load assets
        loadAssets();

        // UI
        setupUI();

        // Animate
        animate();
    }

    // ── Stars ──
    function createStars() {
        const starGeo = new THREE.BufferGeometry();
        const positions = [];
        const sizes = [];
        for (let i = 0; i < 6000; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);
            const r = 3000 + Math.random() * 2000;
            positions.push(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
            sizes.push(Math.random() * 2 + 0.5);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        starGeo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1.5,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.8
        });
        scene.add(new THREE.Points(starGeo, starMat));
    }

    // ── Load Assets ──
    function loadAssets() {
        const loader = new THREE.TextureLoader();
        const pctEl = document.getElementById('loadPct');

        const onProgress = () => {
            loaded++;
            pctEl.textContent = Math.round(loaded / totalAssets * 100) + '%';
            if (loaded >= totalAssets) {
                buildTerrain();
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        };

        // Load heightmap
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
            const cv = document.createElement('canvas');
            cv.width = img.naturalWidth;
            cv.height = img.naturalHeight;
            const c = cv.getContext('2d');
            c.drawImage(img, 0, 0);
            heightData = c.getImageData(0, 0, cv.width, cv.height).data;
            onProgress();
        };
        img.src = ASSETS + 'heightmap_8bit.png';

        // Load textures
        for (const [key, file] of Object.entries(TEXTURE_FILES)) {
            loader.load(ASSETS + file, (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.minFilter = THREE.LinearMipMapLinearFilter;
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                textures[key] = tex;
                onProgress();
            });
        }

        // Load metadata
        fetch(ASSETS + 'terrain_meta.json')
            .then(r => r.json())
            .then(d => { meta = d; onProgress(); })
            .catch(() => { meta = { dem_min_m: -6000, dem_max_m: -1000, dem_range_m: 5000, grid_size: 1024 }; onProgress(); });
    }

    // ── Build Terrain ──
    function buildTerrain() {
        const size = meta.grid_size || 1024;
        const segments = Math.min(size - 1, 1023);
        const planeSize = 800;

        terrainGeo = new THREE.PlaneGeometry(planeSize, planeSize, segments, segments);
        terrainGeo.rotateX(-Math.PI / 2);

        // Apply heightmap displacement
        const positions = terrainGeo.attributes.position;
        const heightScale = (meta.dem_range_m || 5000) / 255;

        for (let i = 0; i < positions.count; i++) {
            const u = (i % (segments + 1)) / segments;
            const v = Math.floor(i / (segments + 1)) / segments;
            const px = Math.floor(u * (size - 1));
            const py = Math.floor(v * (size - 1));
            const idx = (py * size + px) * 4; // RGBA
            const h = heightData[idx] || 0;
            const elevation = (h / 255) * verticalExag;
            positions.setY(i, elevation * 0.5);
        }

        terrainGeo.computeVertexNormals();

        const mat = new THREE.MeshStandardMaterial({
            map: textures.combined || null,
            roughness: 0.85,
            metalness: 0.05,
            flatShading: false,
            side: THREE.DoubleSide
        });

        terrain = new THREE.Mesh(terrainGeo, mat);
        scene.add(terrain);

        // Update info
        document.getElementById('infoElev').textContent =
            `${Math.round(meta.dem_min_m)}m → ${Math.round(meta.dem_max_m)}m`;
        document.getElementById('infoCov').textContent =
            `${meta.total_width_km || '—'} × ${meta.total_height_km || '—'} km`;
        document.getElementById('infoVerts').textContent =
            `${(positions.count / 1000).toFixed(0)}K`;

        // Create crater labels
        if (meta.craters) {
            const labelsDiv = document.getElementById('craterLabels');
            meta.craters.forEach(c => {
                const el = document.createElement('div');
                el.className = 'crater-label';
                el.textContent = c.name;
                el.dataset.px = c.px;
                el.dataset.py = c.py;
                labelsDiv.appendChild(el);
                craterLabels.push(el);
            });
        }
    }

    // ── Update Heights ──
    function updateHeights() {
        if (!terrainGeo || !heightData) return;
        const positions = terrainGeo.attributes.position;
        const size = meta.grid_size || 1024;
        const segments = Math.min(size - 1, 1023);

        for (let i = 0; i < positions.count; i++) {
            const u = (i % (segments + 1)) / segments;
            const v = Math.floor(i / (segments + 1)) / segments;
            const px = Math.floor(u * (size - 1));
            const py = Math.floor(v * (size - 1));
            const idx = (py * size + px) * 4;
            const h = heightData[idx] || 0;
            positions.setY(i, (h / 255) * verticalExag * 0.5);
        }

        positions.needsUpdate = true;
        terrainGeo.computeVertexNormals();
    }

    // ── Update Crater Labels ──
    function updateLabels() {
        if (!meta.craters || !terrain) return;
        const size = meta.grid_size || 1024;

        craterLabels.forEach((el, i) => {
            const c = meta.craters[i];
            const u = c.px / size;
            const v = c.py / size;
            const x = (u - 0.5) * 800;
            const z = (v - 0.5) * 800;

            const pos = new THREE.Vector3(x, 30, z);
            pos.project(camera);

            if (pos.z > 1) {
                el.style.display = 'none';
                return;
            }

            el.style.display = '';
            const screenX = (pos.x * 0.5 + 0.5) * window.innerWidth;
            const screenY = (-pos.y * 0.5 + 0.5) * window.innerHeight;
            el.style.left = screenX + 'px';
            el.style.top = screenY + 'px';
        });
    }

    // ── UI Setup ──
    function setupUI() {
        // Texture buttons
        document.querySelectorAll('[data-texture]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-texture]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const key = btn.dataset.texture;
                if (terrain && textures[key]) {
                    terrain.material.map = textures[key];
                    terrain.material.needsUpdate = true;
                }
            });
        });

        // Wireframe toggle
        document.getElementById('toggleWireframe').addEventListener('click', function() {
            wireframeOn = !wireframeOn;
            if (terrain) terrain.material.wireframe = wireframeOn;
            this.textContent = wireframeOn ? '◼ Solid' : '◻ Wireframe';
            this.classList.toggle('active', wireframeOn);
        });

        // Bloom toggle
        document.getElementById('toggleBloom').addEventListener('click', function() {
            bloomOn = !bloomOn;
            bloomPass.enabled = bloomOn;
            this.textContent = bloomOn ? '✦ Glow: ON' : '✦ Glow: OFF';
            this.classList.toggle('active', bloomOn);
        });

        // Auto-rotate
        document.getElementById('autoRotate').addEventListener('click', function() {
            controls.autoRotate = !controls.autoRotate;
            controls.autoRotateSpeed = 0.5;
            this.classList.toggle('active', controls.autoRotate);
        });

        // Vertical exaggeration slider
        const slider = document.getElementById('exagSlider');
        const sliderVal = document.getElementById('exagVal');
        slider.addEventListener('input', () => {
            verticalExag = parseFloat(slider.value);
            sliderVal.textContent = verticalExag + '×';
            updateHeights();
        });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r') controls.autoRotate = !controls.autoRotate;
            if (e.key === 'w') { wireframeOn = !wireframeOn; if (terrain) terrain.material.wireframe = wireframeOn; }
        });
    }

    // ── Animation Loop ──
    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // Update camera altitude display
        const camDist = camera.position.length();
        document.getElementById('infoCam').textContent = Math.round(camDist) + ' units';

        // Update crater labels
        updateLabels();

        // Render
        if (bloomOn) {
            composer.render();
        } else {
            renderer.render(scene, camera);
        }
    }

    // ── Start ──
    init();
    </script>
</body>
</html>
